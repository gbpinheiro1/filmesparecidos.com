<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filmes parecidos com...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,500;1,14..32,500&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poetsen+One&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="assets/favicon-dark.ico"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="shortcut icon"
      href="assets/favicon-light.ico"
      media="(prefers-color-scheme: light)"
    />
  </head>

  <body>
    <link rel="stylesheet" href="style.css" />
    <div id="container">
      <header>
        <img src="assets/logo_2.png" alt="" id="eye_logo" />
      </header>

      <main>
        <section id="character">
          <img
            src="assets/robot_before_selection.png"
            alt="robot character"
            id="robot"
          />
        </section>
        <section id="center_elements">
          <div id="dialogue">
            <p id="dialogue_text">
              Olá! Meu nome é Arias e sou um robô cinéfilo! Me conte um filme
              que você gosta e vou te recomendar outros parecidos com ele para
              você assistir!
            </p>
          </div>

          <div id="text_input">
            <input
              type="text"
              name="film_name"
              id="film_name"
              placeholder="Digite o nome do filme..."
              autocomplete="off"
            />
            <ul id="film_list" style="list-style-type: none"></ul>
          </div>
        </section>
      </main>
      <footer>
        <p>Desenvolvido por Gabriel Pinheiro</p>
        <div id="logos">
          <a
            href="https://github.com/gbpinheiro1"
            id="logo_git"
            target="_blank"
          ></a>
          <a
            href="https://www.linkedin.com/in/gabriel-pinheiro-da-silva/"
            id="logo_linkedin"
            target="_blank"
          ></a>
        </div>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
